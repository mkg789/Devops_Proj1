apiVersion: apps/v1
kind: Deployment
metadata:
  name: electronicsweb-backend
  namespace: electronicsweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: electronicsweb-backend
  template:
    metadata:
      labels:
        app: electronicsweb-backend
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: backend
          image: 192.168.49.1:80/electronicsweb/electronicsweb-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: electronicsweb-backend-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: electronicsweb-backend-secrets
                  key: JWT_SECRET
